<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Universal Movie Streamer</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: #090d16; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 25px 15px; }
    .card { width: 100%; max-width: 850px; background: #131b2e; border-radius: 12px; padding: 20px; box-shadow: 0 10px 35px rgba(0,0,0,0.6); }
    h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; font-size: 1.4rem; }
    .input-box { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 12px 14px; border-radius: 8px; border: 1px solid #334155; background: #090d16; color: #fff; font-size: 14px; outline: none; }
    button { padding: 12px 20px; border-radius: 8px; border: none; background: #0284c7; color: white; font-weight: bold; cursor: pointer; }
    .loader { text-align: center; color: #38bdf8; display: none; margin: 10px 0; font-size: 14px; }
    
    .result-box { display: none; margin-bottom: 20px; background: #090d16; padding: 14px; border-radius: 8px; border: 1px dashed #38bdf8; }
    .stream-url { background: #000; padding: 10px; border-radius: 6px; font-size: 13px; color: #7dd3fc; word-break: break-all; margin: 8px 0; }
    .copy-btn { background: #10b981; padding: 8px 14px; border-radius: 6px; border: none; color: white; font-weight: bold; cursor: pointer; }

    .player-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 10px; overflow: hidden; margin-top: 10px; }
    video, iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎬 ইউনিভার্সাল মুভি স্ট্রিমার</h2>

    <div class="input-box">
      <input type="text" id="pageUrl" placeholder="যেকোনো মুভির লিংক পেস্ট করুন..." />
      <button onclick="extractStream()">প্লে করুন</button>
    </div>

    <div class="loader" id="loader">মুভি সোর্স ডিক্রিপ্ট এবং নতুন স্ট্রিম তৈরি হচ্ছে...</div>

    <div class="result-box" id="resultBox">
      <div style="font-size: 13px; color: #94a3b8;">✅ সম্পূর্ণ নতুন ও আনলিংকড প্লে-লিংক তৈরি হয়েছে:</div>
      <div class="stream-url" id="streamUrl"></div>
      <button class="copy-btn" onclick="copyLink()">লিংক কপি করুন</button>
    </div>

    <div class="player-container">
      <video id="videoPlayer" controls playsinline style="display:none;"></video>
      <!-- স্যান্ডবক্সড আইফ্রেম যা মুভি সাইটের সব পপ-আপ ও ভাইরাস অ্যাড ব্লক করে -->
      <iframe id="iframePlayer" sandbox="allow-scripts allow-same-origin allow-forms" allow="autoplay; fullscreen" style="display:none;"></iframe>
    </div>
  </div>

  <script>
    async function extractStream() {
      const url = document.getElementById('pageUrl').value.trim();
      if (!url) return alert('লিংক পেস্ট করুন!');

      const loader = document.getElementById('loader');
      const resultBox = document.getElementById('resultBox');
      const streamUrl = document.getElementById('streamUrl');
      const videoPlayer = document.getElementById('videoPlayer');
      const iframePlayer = document.getElementById('iframePlayer');

      loader.style.display = 'block';
      resultBox.style.display = 'none';

      try {
        const res = await fetch('/api/extract', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pageUrl: url })
        });
        const data = await res.json();
        loader.style.display = 'none';

        if (!data.success) {
          return alert(data.error || 'ভিডিও পাওয়া যায়নি');
        }

        // নতুন লিংক প্রদর্শন
        streamUrl.textContent = data.newStreamLink;
        resultBox.style.display = 'block';

        // প্লে শুরু
        if (data.type === 'direct') {
          iframePlayer.style.display = 'none';
          videoPlayer.style.display = 'block';
          if (Hls.isSupported() && data.newStreamLink.includes('.m3u8')) {
            const hls = new Hls();
            hls.loadSource(data.newStreamLink);
            hls.attachMedia(videoPlayer);
          } else {
            videoPlayer.src = data.newStreamLink;
          }
          videoPlayer.play();
        } else {
          videoPlayer.style.display = 'none';
          iframePlayer.src = data.newStreamLink;
          iframePlayer.style.display = 'block';
        }
      } catch (err) {
        loader.style.display = 'none';
        alert('ত্রুটি: ' + err.message);
      }
    }

    function copyLink() {
      navigator.clipboard.writeText(document.getElementById('streamUrl').textContent);
      alert('নতুন স্ট্রিমিং লিংক কপি হয়েছে! এটি যে কাউকে পাঠাতে পারেন।');
    }
  </script>
</body>
</html>
