<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal Video Stream Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 12px; }
    .card { width: 100%; max-width: 800px; background: #131b2e; border-radius: 14px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
    h2 { text-align: center; color: #38bdf8; margin-bottom: 16px; font-size: 1.3rem; }
    .input-box { display: flex; gap: 8px; margin-bottom: 15px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #080c14; color: #fff; font-size: 14px; outline: none; }
    button { padding: 12px 18px; border-radius: 8px; border: none; background: #0284c7; color: white; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .loader { text-align: center; color: #38bdf8; display: none; margin: 12px 0; font-size: 14px; }
    
    .result-box { display: none; margin-bottom: 18px; background: #080c14; padding: 14px; border-radius: 10px; border: 1px dashed #38bdf8; }
    .stream-url { background: #000; padding: 10px; border-radius: 6px; font-size: 13px; color: #7dd3fc; word-break: break-all; margin: 10px 0; }
    .btn-group { display: flex; gap: 8px; }
    .btn-copy { background: #10b981; }
    .btn-open { background: #8b5cf6; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; padding: 10px 16px; border-radius: 8px; color: #fff; font-size: 13px; font-weight: bold; }

    .player-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 10px; overflow: hidden; margin-top: 15px; }
    video, iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎬 ইউনিভার্সাল সিনেমা স্ট্রিম জেনারেটর</h2>

    <div class="input-box">
      <input type="text" id="pageUrl" placeholder="মুভিবক্স বা যেকোনো মুভির লিংক পেস্ট করুন..." />
      <button onclick="extractStream()">তৈরি করুন</button>
    </div>

    <div class="loader" id="loader">মুভি সোর্স ডিক্রিপ্ট এবং ক্লিন প্লে-লিংক তৈরি হচ্ছে...</div>

    <div class="result-box" id="resultBox">
      <div style="font-size: 13px; color: #94a3b8; font-weight: bold;">✅ সম্পূর্ণ নতুন ও আনলিংকড প্লে-লিংক তৈরি হয়েছে:</div>
      <div class="stream-url" id="streamUrl"></div>
      <div class="btn-group">
        <button class="btn-copy" onclick="copyLink()">লিংক কপি করুন</button>
        <a href="#" target="_blank" id="openLink" class="btn-open">নতুন ট্যাবে দেখুন ↗</a>
      </div>
    </div>

    <div class="player-container">
      <video id="videoPlayer" controls playsinline style="display:none;"></video>
      <iframe id="iframePlayer" sandbox="allow-scripts allow-same-origin allow-forms" allow="autoplay; fullscreen" style="display:none;"></iframe>
    </div>
  </div>

  <script>
    let hlsInstance = null;

    async function extractStream() {
      const url = document.getElementById('pageUrl').value.trim();
      if (!url) return alert('অনুগ্রহ করে একটি লিংক দিন!');

      const loader = document.getElementById('loader');
      const resultBox = document.getElementById('resultBox');
      const streamUrl = document.getElementById('streamUrl');
      const openLink = document.getElementById('openLink');
      const video = document.getElementById('videoPlayer');
      const iframe = document.getElementById('iframePlayer');

      loader.style.display = 'block';
      resultBox.style.display = 'none';

      try {
        const res = await fetch('/api/extract', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pageUrl: url })
        });
        const data = await res.json();
        loader.style.display = 'none';

        if (!data.success) {
          return alert(data.error || 'ভিডিও লিংক বের করা সম্ভব হয়নি!');
        }

        // নতুন শেয়ারেবল ওয়াচ লিংক সেট করা
        streamUrl.textContent = data.newStreamLink;
        openLink.href = data.newStreamLink;
        resultBox.style.display = 'block';

        // প্রিভিউ প্লেয়ার
        if (data.type === 'embed') {
          video.style.display = 'none';
          iframe.style.display = 'block';
          iframe.src = data.newStreamLink;
        } else {
          iframe.style.display = 'none';
          video.style.display = 'block';

          if (hlsInstance) hlsInstance.destroy();

          if (Hls.isSupported()) {
            hlsInstance = new Hls();
            hlsInstance.loadSource(data.rawProxyUrl);
            hlsInstance.attachMedia(video);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
              video.play().catch(() => { video.muted = true; video.play(); });
            });
          } else {
            video.src = data.rawProxyUrl;
            video.play();
          }
        }
      } catch (err) {
        loader.style.display = 'none';
        alert('ত্রুটি: ' + err.message);
      }
    }

    function copyLink() {
      navigator.clipboard.writeText(document.getElementById('streamUrl').textContent);
      alert('নতুন স্ট্রিমিং লিংক কপি হয়েছে! এখন এটি যেকোনো জায়গায় পেস্ট করলেই সরাসরি ফুলস্ক্রিনে চলবে।');
    }
  </script>
</body>
</html>
