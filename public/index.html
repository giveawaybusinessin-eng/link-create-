<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Stream Generator & Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 15px; }
    .card { width: 100%; max-width: 850px; background: #151e2e; border-radius: 14px; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); border: 1px solid #1e293b; }
    h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; font-size: 1.6rem; }
    .input-box { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 14px; border-radius: 8px; border: 1px solid #334155; background: #0b0f19; color: #fff; font-size: 14px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { padding: 14px 22px; border-radius: 8px; border: none; background: #0284c7; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    button:hover { background: #0369a1; }
    
    /* নতুন স্ট্রিম লিংক বক্স */
    .result-section { display: none; margin-bottom: 22px; background: #0e1726; padding: 16px; border-radius: 8px; border: 1px dashed #38bdf8; }
    .result-title { font-size: 13px; color: #38bdf8; margin-bottom: 8px; font-weight: bold; }
    .link-container { display: flex; gap: 10px; align-items: center; }
    .stream-url { flex: 1; background: #050811; padding: 10px; border-radius: 6px; font-size: 13px; color: #a5f3fc; word-break: break-all; }
    .copy-btn { background: #10b981; padding: 10px 16px; font-size: 13px; }
    .copy-btn:hover { background: #059669; }

    /* প্লেয়ার */
    .player-box { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 10px; overflow: hidden; margin-top: 10px; }
    video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .loader { text-align: center; color: #94a3b8; display: none; margin-bottom: 15px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🚀 Universal Video Stream Resolver</h2>

    <div class="input-box">
      <input type="text" id="targetUrl" placeholder="মুভিবক্স বা যেকোনো ভিডিও পেজের লিংক দিন (যেমন: https://v.moviebox.ph/SNLLNgn3db7)..." />
      <button onclick="extractAndPlay()">স্ট্রিম তৈরি করুন</button>
    </div>

    <div class="loader" id="loader">ভিডিও স্ট্রিম এক্সট্র্যাক্ট এবং নতুন লিংক তৈরি করা হচ্ছে...</div>

    <!-- নতুন প্রস্তুত লিংক দেখানোর বক্স -->
    <div class="result-section" id="resultSection">
      <div class="result-title">✅ সম্পূর্ণ নতুন ও ব্র্যান্ডলেস স্ট্রিমিং প্লে-লিংক তৈরি হয়েছে:</div>
      <div class="link-container">
        <div class="stream-url" id="streamUrlText"></div>
        <button class="copy-btn" onclick="copyStreamLink()">লিংক কপি</button>
      </div>
    </div>

    <!-- ক্লিন প্লেয়ার -->
    <div class="player-box">
      <video id="player" controls playsinline></video>
    </div>
  </div>

  <script>
    const player = document.getElementById('player');
    const resultSection = document.getElementById('resultSection');
    const streamUrlText = document.getElementById('streamUrlText');
    const loader = document.getElementById('loader');

    async function extractAndPlay(customUrl) {
      const pageUrl = customUrl || document.getElementById('targetUrl').value.trim();
      if (!pageUrl) return alert('অনুগ্রহ করে লিংক পেস্ট করুন!');

      loader.style.display = 'block';
      resultSection.style.display = 'none';

      try {
        const res = await fetch('/api/extract', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pageUrl })
        });
        const data = await res.json();
        loader.style.display = 'none';

        if (!data.success) {
          alert(data.error || 'ভিডিও স্ট্রিম বের করা সম্ভব হয়নি!');
          return;
        }

        // নতুন তৈরি হওয়া স্ট্রিম লিংক দেখানো
        streamUrlText.textContent = data.newStreamLink;
        resultSection.style.display = 'block';

        // নতুন লিংকে ভিডিও চালানো (মুভিবক্সের কোনো লোগো/অ্যাড ছাড়া)
        loadStream(data.newStreamLink);

      } catch (err) {
        loader.style.display = 'none';
        alert('সার্ভারে সমস্যা হয়েছে: ' + err.message);
      }
    }

    function loadStream(url) {
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(player);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          player.play().catch(() => { player.muted = true; player.play(); });
        });
      } else {
        player.src = url;
        player.play().catch(() => { player.muted = true; player.play(); });
      }
    }

    function copyStreamLink() {
      navigator.clipboard.writeText(streamUrlText.textContent);
      alert('নতুন স্ট্রিমিং লিংক কপি করা হয়েছে!');
    }

    // যদি সরাসরি URL প্যারাম দিয়ে ব্রাউজারে লিংক ওপেন করা হয়
    window.onload = () => {
      const params = new URLSearchParams(window.location.search);
      const streamParam = params.get('stream');
      if (streamParam) {
        loadStream(streamParam);
      }
    };
  </script>
</body>
</html>
